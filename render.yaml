services:
  - type: web
    name: kerama-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MANAGER_CHAT_ID
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
